# Template: copy into your own deployment and replace every example value.
name = "claude-session-share"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# Access protects the custom domains, not workers.dev.
workers_dev = false
routes = [{ pattern = "sessions.example.com", custom_domain = true }, { pattern = "sessions-mcp.example.com", custom_domain = true }]

[[r2_buckets]]
binding = "SESSIONS"
bucket_name = "claude-session-share"

[[d1_databases]]
binding = "DB"
database_name = "claude-session-share"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "./migrations"

# The MCP host requires an Access Bypass policy; OAuth uses an allowlisted Access SaaS OIDC app.
# Secrets: BROKER_SIGNING_KEY (>=32 bytes), OIDC_CLIENT_SECRET.
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "00000000000000000000000000000000"

# Public identifiers, not secrets.
[vars]
BROKER_ORIGIN = "https://sessions-mcp.example.com"
OIDC_CLIENT_ID = "your-access-oidc-client-id"
ACCESS_TEAM_DOMAIN = "example.cloudflareaccess.com"
ACCESS_AUD = "your-access-application-aud"

# dist/ is built by `npm run build:skill`. The Worker runs first so the Access check guards it.
[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true
